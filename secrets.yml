azure:
  AZURE_SUBSCRIPTION_ID: !var ci/azure/subscription-id
  AZURE_RESOURCE_GROUP: !var ci/azure/authn-test/resource-group
  USER_ASSIGNED_IDENTITY: !var ci/azure/authn-test/user-assigned-id
  USER_ASSIGNED_IDENTITY_CLIENT_ID: !var ci/azure/authn-test/user-assigned-id-client-id

release:
  JFROG_CLI_OFFER_CONFIG: "false"
  JFROG_URL: !var ci/artifactory/url
  JFROG_USERNAME: !var ci/artifactory/users/jenkins/username
  JFROG_APIKEY: !var ci/artifactory/users/jenkins/api-key
  JFROG_REPO: "libs-snapshot-local"

  CENTRAL_PORTAL_USERNAME: !var ecosystems/java/ossrh/token/username
  CENTRAL_PORTAL_TOKEN: !var ecosystems/java/ossrh/token/password
  GPG_PRIVATE_KEY: !var:file ecosystems/java/gpg/private-key
  GPG_PASSWORD: !var:file ecosystems/java/gpg/password
